<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cars Image Gallery</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#0b0d10;color:#fff}
.hero{height:42vh;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#0005,#000c),url('images/hero.jpg') center/cover}
h1{font-size:clamp(46px,9vw,96px);letter-spacing:6px}.hero p{margin-top:10px;letter-spacing:3px}
main{max-width:1200px;margin:auto;padding:50px 22px}.intro{text-align:center;margin-bottom:32px}.intro p{color:#aaa;margin-top:9px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{position:relative;overflow:hidden;border-radius:14px;background:#181b20;box-shadow:0 8px 24px #0005}
.card img{width:100%;height:260px;object-fit:cover;display:block;transition:.4s}.card:hover img{transform:scale(1.08);filter:brightness(.7)}
.label{position:absolute;bottom:0;width:100%;padding:38px 18px 16px;background:linear-gradient(transparent,#000e);font-size:21px;font-weight:bold}
footer{text-align:center;color:#777;padding:25px;border-top:1px solid #222}
@media(max-width:800px){.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.gallery{grid-template-columns:1fr}}
</style></head><body><section class="hero"><div><h1>CARS</h1><p>POWER • SPEED • DESIGN</p></div></section>
<main><div class="intro"><h2>Premium Car Gallery</h2><p>A collection of iconic machines built for performance and style.</p></div>
<section class="gallery"><div class="card"><img src="images/bmw.jpg" alt="BMW"><div class="label">BMW</div></div>
<div class="card"><img src="images/mercedes.jpg" alt="Mercedes-Benz"><div class="label">Mercedes-Benz</div></div>
<div class="card"><img src="images/audi.jpg" alt="Audi"><div class="label">Audi</div></div>
<div class="card"><img src="images/ferrari.jpg" alt="Ferrari"><div class="label">Ferrari</div></div>
<div class="card"><img src="images/lamborghini.jpg" alt="Lamborghini"><div class="label">Lamborghini</div></div>
<div class="card"><img src="images/porsche.jpg" alt="Porsche"><div class="label">Porsche</div></div>
<div class="card"><img src="images/mustang.jpg" alt="Ford Mustang"><div class="label">Ford Mustang</div></div>
<div class="card"><img src="images/range-rover.jpg" alt="Range Rover"><div class="label">Range Rover</div></div></section></main><footer>Cars Image Gallery • Theme Based Web Design</footer></body></html>
